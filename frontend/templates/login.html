{% extends "base.html" %}
{% block title %}Connexion · VisualVault{% endblock %}
{% block content %}
<div class="card-soft p-4">
  <h4 class="mb-1">Connexion</h4>
  <p class="text-muted mb-4">Accédez à votre galerie.</p>
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Nom d'utilisateur</label>
      <input type="text" name="username" class="form-control" required autofocus>
    </div>
    <div class="mb-4">
      <label class="form-label">Mot de passe</label>
      <input type="password" name="password" class="form-control" required>
    </div>
    <button class="btn btn-primary w-100">Se connecter</button>
  </form>
  <p class="mt-3 mb-0 text-center text-muted">
    Pas de compte ? <a href="{{ url_for('auth.register') }}">S'inscrire</a>
  </p>
</div>
{% endblock %}
