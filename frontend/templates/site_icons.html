{% macro icon(name) %}

  <rect x="3" y="8" width="18" height="13" rx="2"/><path d="M5 4h14M8 13h8"/>

  <circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/>

  <path d="M3 4h18l-7 8v7l-4 2v-9z"/>
  {% elif name == 'bars' %}
  <path d="M5 20v-5m7 5V5m7 15V9"/>

  <path d="M4 12h16m-5-5 5 5-5 5"/>

  <path d="M10 17v3H4V4h6v3m-1 5h12m-4-4 4 4-4 4"/>

  <path d="M4 6h16M4 12h16M4 18h16"/>
